# PureEOS TEST ONLY 1.0.0-test.1; independent test data/config paths.
# CPU/NET come from genesis or authorized on-chain actions, not this INI.
# No keys, producer names, genesis signer or peers are shipped. Configure your own.
plugin = eosio::chain_api_plugin
plugin = eosio::producer_plugin
http-server-address = 127.0.0.1:8888
p2p-listen-endpoint = 127.0.0.1:9876
chain-state-db-size-mb = 4096
chain-state-db-guard-size-mb = 128
chain-threads = 2
vote-threads = 2
net-threads = 2
http-threads = 1
read-only-threads = 0
incoming-transaction-queue-size-mb = 256
http-max-bytes-in-flight-mb = 64
http-max-in-flight-requests = 128
max-clients = 64
p2p-max-nodes-per-host = 64
validation-mode = full
wasm-runtime = eos-vm-jit
experimental-parallel-validation-threads = 4
experimental-parallel-validation-batch-size = 12
experimental-parallel-engine = jit
experimental-parallel-production = true
experimental-parallel-early-adoption = true
experimental-parallel-early-adoption-group = 4
experimental-parallel-native-capture = true
experimental-parallel-native-capture-staged = false
experimental-parallel-input-fingerprints = true
experimental-parallel-trace-reserve = true
# Existing released system; BP-bond system; token. Unknown code keeps safe fallback.
experimental-parallel-code-hash = 373b66b2994c3131ce6c9c3d4526fdf836c0ac2c36d8265b2239d61e75ca2ceb
experimental-parallel-code-hash = b591ca661e8256b7d1c7370fe11e5825427c98b4f84eceb3cdf735c06e5e8170
