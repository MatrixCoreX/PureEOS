# PureEOS baseline-2026.10.30 / 并行节点配置示例
# Supply your own endpoint, key providers and consensus-compatible contract hashes.
plugin = eosio::chain_api_plugin
plugin = eosio::net_api_plugin
validation-mode = full
experimental-parallel-production = true
experimental-parallel-validation-threads = 8
experimental-parallel-validation-batch-size = 24
experimental-parallel-early-adoption-group = 8
incoming-transaction-queue-size-mb = 1024
experimental-parallel-code-hash = f8c5fbfb14bbab7da4f5bd3cb04a2a8967c5e0d39f5794eb12768a13e1375d0c
experimental-parallel-code-hash = 5f25a25816fc6db145dbd811d9c24dd99c9b9b1fd260b8e16a045476d0c3c11a
# Add only separately validated contract WASM hashes. Unknown hashes use safe fallback.
# p2p-peer-address = <ordinary-seed-host:port>
# Signed BP discovery additionally requires your own registered current peer key.
# peer-private-key = <your-owned-current-peer-key-provider>
chain-threads = 6
force-all-checks = true
disable-replay-opts = true
max-transaction-time = 100
