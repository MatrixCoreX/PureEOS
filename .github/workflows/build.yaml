name: PureEOS candidate checks

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      controls-only:
        description: Run tooling controls without rebuilding unchanged native components
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    name: Candidate tooling controls
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Install control prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-yaml build-essential cmake ninja-build git openssh-client ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout fixed dependencies
        env:
          AIC_VM_DEPLOY_KEY: ${{ secrets.AIC_VM_DEPLOY_KEY }}
        run: python3 -I -B tools/checkout_ci_dependencies.py
      - name: Verify pinned VM patch and run three fixed rounds
        run: |
          mkdir -p ci-results
          python3 -I -B tools/prepare_vm_vendor.py --apply
          python3 -I -B tools/prepare_vm_vendor.py --check
          python3 -B tests/run_v1_candidate_controls.py --output ci-results/controls
      - name: Preserve actual control reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-tooling-controls
          path: ci-results/controls/
          retention-days: 7

  native:
    name: Native component checks (${{ matrix.ubuntu }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.controls-only }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04", "26.10"]
    uses: ./.github/workflows/build_base.yaml
    secrets:
      AIC_VM_DEPLOY_KEY: ${{ secrets.AIC_VM_DEPLOY_KEY }}
    with:
      ubuntu-release: ${{ matrix.ubuntu }}
